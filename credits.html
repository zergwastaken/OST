<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Tools - Credits & Updates</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/credits.css">
    <!-- Scripts -->
    <script src="scripts/header-footer.js" defer></script>
    <script src="scripts/credits.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="home-title">CREDITS & UPDATES</h1>
        
        <h2>🛠️ Development Credits</h2>
        <table>
            <thead>
                <tr>
                    <th>Role</th>
                    <th>Lead / Contributor</th>
                    <th>Focus Area</th>
                </tr>
            </thead>
            <tbody id="credits-tbody">
                <!-- Dynamically populated by credits.js -->
            </tbody>
        </table>

        <h2>🚀 System Update Log</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Version</th>
                    <th>Feature / Update Description</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="updates-tbody">
                <!-- Dynamically populated by credits.js -->
            </tbody>
        </table>
    </div>
    
    <footer>
        If you would also like to contribute to this and end up on the development credits, feel free to Teams me feedback and/or suggestions @ OS3 Grinager
    </footer>
</body>
</html>
