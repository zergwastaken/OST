<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Tools - Timer</title>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body style="padding-top: 100px;">
    <script src="scripts/header-footer.js" defer></script>
    <main id="main">
        <h1 class="home-title">MULTI TIMER</h1>

        <p class="home-subtitle">Track multiple operations simultaneously with our Multi Timer tool.</p>
        <!-- SLEEK DASHBOARD LAYOUT -->
        <!-- UNIFIED DASHBOARD LAYOUT -->
        <div class="dashboard-wrapper">
            
            <div class="dashboard-panel">
                <!-- Left Side: Coast Guard Presets -->
                <div class="panel-section">
                    <div class="panel-label">QUICK DEPLOY PRESETS</div>
                    <div class="btn-grid presets-grid">
                        <button class="btn compact-btn preset-btn" onclick="presetTimer(1)">
                            <h3>🚢 Cutter</h3>
                            <p>4 Hours</p>
                        </button>
                        <button class="btn compact-btn preset-btn" onclick="presetTimer(2)">
                            <h3>✈️ Fixed Wing</h3>
                            <p>30 Mins</p>
                        </button>
                        <button class="btn compact-btn preset-btn" onclick="presetTimer(3)">
                            <h3>🚤 Small Boat</h3>
                            <p>30 Mins</p>
                        </button>
                        <button class="btn compact-btn preset-btn" onclick="presetTimer(4)">
                            <h3>🚁 Rotary Wing</h3>
                            <p>15 Mins</p>
                        </button>
                    </div>
                </div>

                <!-- Right Side: Custom Actions -->
                <div class="panel-section highlight-section">
                    <div class="panel-label">CUSTOM OPERATIONS</div>
                    <div class="btn-grid custom-grid">
                        <button class="btn compact-btn custom-action-btn" onclick="createCustomTimer()">
                            <h3>⏲️ Countdown</h3>
                            <p>Set Duration</p>
                        </button>
                        <button class="btn compact-btn custom-action-btn" onclick="createCustomAlarm()">
                            <h3>⏰ Time of Day</h3>
                            <p>Target Alarm</p>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Integrated Alignment Toolbar -->
            <div class="dashboard-toolbar">
                <span class="toolbar-label">⚙️ Timer Alignment Rules:</span>
                <div class="segmented-control" id="startAlignControl" role="tablist">
                    <input type="radio" id="align_prev" name="startAlign" value="prev">
                    <label for="align_prev">Prev Min</label>
                    
                    <input type="radio" id="align_immediate" name="startAlign" value="immediate" checked>
                    <label for="align_immediate">Immediate</label>
                    
                    <input type="radio" id="align_next" name="startAlign" value="next">
                    <label for="align_next">Next Min</label>
                </div>
            </div>
            
        </div>

    <div id="timers-container"></div>
    </main>

    <!-- Custom Timer Popup -->
    <div id="customTimerModal" class="custom-modal" aria-hidden="true">
        <div class="custom-modal-content">
            <h2>Create Custom Timer</h2>
            <div class="form-row">
                <label for="customTimerName">Name</label>
                <input id="customTimerName" type="text" maxlength="40" placeholder="Timer name">
            </div>
            <div class="form-row">
                <label for="customTimerEmoji">Emoji</label>
                <input id="customTimerEmoji" type="text" maxlength="2" placeholder="⏲️">
            </div>
            <div class="emoji-picker" id="customEmojiPicker"></div>
            <div class="form-row time-inputs">
                <div class="input-wrapper">
                    <label for="customTimerHours">Hours</label>
                    <div class="number-spinner">
                        <button type="button" class="spinner-btn spinner-up" data-target="customTimerHours">▲</button>
                        <input id="customTimerHours" type="number" min="0" value="0" placeholder="e.g. 1">
                        <button type="button" class="spinner-btn spinner-down" data-target="customTimerHours">▼</button>
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="customTimerMinutes">Minutes</label>
                    <div class="number-spinner">
                        <button type="button" class="spinner-btn spinner-up" data-target="customTimerMinutes">▲</button>
                        <input id="customTimerMinutes" type="number" min="0" value="0" placeholder="e.g. 30">
                        <button type="button" class="spinner-btn spinner-down" data-target="customTimerMinutes">▼</button>
                    </div>
                </div>
                <div class="input-wrapper">
                    <label for="customTimerSeconds">Seconds</label>
                    <div class="number-spinner">
                        <button type="button" class="spinner-btn spinner-up" data-target="customTimerSeconds">▲</button>
                        <input id="customTimerSeconds" type="number" min="0" max="59" value="0" placeholder="e.g. 00">
                        <button type="button" class="spinner-btn spinner-down" data-target="customTimerSeconds">▼</button>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="createCustomTimerBtn" class="btn start-btn">Create</button>
                <button id="cancelCustomTimerBtn" class="btn remove-btn">Cancel</button>
            </div>
        </div>
    </div>
    
    <!-- Custom Alarm Popup -->
    <div id="customAlarmModal" class="custom-modal" aria-hidden="true">
        <div class="custom-modal-content">
            <h2>Set Alarm Time</h2>
            <div class="form-row">
                <label for="customAlarmName">Name</label>
                <input id="customAlarmName" type="text" maxlength="40" placeholder="Alarm name" value="Alarm">
            </div>
            <div class="form-row">
                <label for="customAlarmEmoji">Emoji</label>
                <input id="customAlarmEmoji" type="text" maxlength="2" placeholder="⏰" value="⏰">
            </div>
            <div class="form-row">
                <label for="customAlarmTime">Target Time</label>
                <input id="customAlarmTime" type="time" required style="width: 100%; font-size: 1.5rem; text-align: center; cursor: pointer;">
            </div>
            <div class="modal-actions">
                <button id="createCustomAlarmBtn" class="btn start-btn">Set Alarm</button>
                <button id="cancelCustomAlarmBtn" class="btn remove-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="myModal"></div>

    <script src="scripts/modal.js"></script>
    <script src="scripts/timer.js"></script>
    <script src="scripts/refresh.js"></script>
</body>
</html>
